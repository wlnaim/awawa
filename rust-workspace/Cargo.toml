[workspace]
resolver = "2"
members = [
    "crates/awawa-protocol",
    "crates/capture-win",
    "crates/input-win",
    "crates/awawa-host",
    "crates/awawa-operator",
    "crates/awawa-service",
    "crates/awawa-relay",
    "crates/awawa-installer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Lista cerrada de crates. Version exacta: la estable mas reciente (sin pre-release,
# no yanked). Cada crate las consume con `x.workspace = true` y agrega sus features.
[workspace.dependencies]
# Runtime
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "sync", "time"] }
# Transporte
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
# Relay
dashmap = "=6.2.1"
governor = "=0.10.4"
# Cripto E2E
spake2 = "=0.4.0"
hkdf = "=0.13.0"
sha2 = "=0.11.1"
chacha20poly1305 = "=0.11.0"
ed25519-dalek = "=3.0.0"
x25519-dalek = "=3.0.0"
rand = "=0.10.3"
zeroize = "=1.9.1"
argon2 = "=0.6.0"
# Serializacion
serde = "=1.0.229"
postcard = { version = "=1.1.3", default-features = false }
# Windows
windows = "=0.62.2"
# Compresion
zstd = "=0.14.3"
# GUI
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui = "=0.37.0"
embed-resource = "=3.0.12"
# Observabilidad
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
